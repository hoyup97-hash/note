<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월급 오답노트 | 돈 문제 안내 모음</title>
<meta name="description" content="월급 받는 사람이 자주 틀리는 돈 문제를 공식 자료 기준으로 정리한 안내 모음입니다.">
<style>
:root{
  --bg-a: oklch(99% 0.006 95);
  --bg-b: oklch(95% 0.032 92);
  --card: oklch(99.5% 0.003 95);
  --ink: oklch(21% 0.012 60);
  --muted: oklch(45% 0.012 60);
  --tint: oklch(92% 0.04 92);
  --pen: oklch(58% 0.215 30);
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
body{overflow-x:clip;font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--bg-a),var(--bg-b)) fixed;line-height:1.65;word-break:keep-all;font-size:17px}
main{max-width:640px;margin:0 auto;padding:28px 20px 64px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.4px}
.brand svg{width:22px;height:22px}
h1{margin-top:28px;font-size:30px;line-height:1.3;font-weight:800;letter-spacing:-1px}
.sum{margin-top:18px;padding:20px 22px;list-style:none}
.sum li{position:relative;padding-left:18px}
.sum li + li{margin-top:8px}
.sum li:before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--pen)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px}
h2{margin-top:44px;font-size:22px;line-height:1.35;font-weight:800;letter-spacing:-.6px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
p{margin-top:14px}
b{font-weight:800}
.k{color:var(--pen);font-weight:800}
ol.steps{margin-top:16px;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:16px 18px 16px 58px;margin-top:10px}
ol.steps li:before{content:counter(s);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.btn{display:inline-block;margin-top:10px;padding:11px 18px;border-radius:12px;background:var(--ink);color:var(--card);font-weight:700;text-decoration:none;font-size:16px}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tw{margin-top:16px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--card);font-size:15.5px}
th,td{padding:12px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--ink)}
tr:first-child th{border-top:0;background:var(--tint);font-weight:800;text-align:center}
td + td, th + th{border-left:1px solid var(--ink)}
td:first-child{font-weight:700;background:var(--tint);width:26%}
.note{margin-top:14px;padding:16px 18px;font-size:15.5px}
ul.links{margin-top:14px;list-style:none}
ul.links li{margin-top:10px}
ul.links a{color:var(--ink);font-weight:700;text-underline-offset:3px}
ul.links span{display:block;color:var(--muted);font-size:14.5px}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--ink);color:var(--muted);font-size:14px}

.list{margin-top:22px;list-style:none}
.list li{margin-top:12px}
.list a{display:block;padding:18px 20px;color:var(--ink);text-decoration:none}
.list b{display:block;font-size:19px;letter-spacing:-.4px}
.list span{display:block;color:var(--muted);font-size:15px;margin-top:2px}
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 21 L16 31 L34 9" fill="none" stroke="var(--pen)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>월급 오답노트</div>
  <h1>돈 문제,<br>자주 틀리는 것만 모았어요</h1>
  <p>게시물에서 다 못 한 이야기를 공식 자료 기준으로 정리해 둔 곳이에요.</p>
  <ul class="list">
    <li><a class="card" href="silson/"><b>실손보험 중복 가입, 확인하고 중지하는 방법</b><span>회사 단체실손과 개인실손을 둘 다 내고 있다면</span></a></li>
  </ul>
  <footer>공식 자료를 정리한 일반 정보예요. 특정 보험사나 상품을 권하지 않고, 상담이나 가입 신청을 받지 않아요.</footer>
</main>
</body>
</html>
